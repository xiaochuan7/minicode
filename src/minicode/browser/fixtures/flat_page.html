<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Minicode M13 页面</title></head>
<body>
  <h1>下单页</h1>
  <div class="row"><div class="btn" id="submit">提交订单</div><span class="hint">今日 17:00 前下单免运费</span></div>
  <div class="row"><input id="name" type="text" placeholder="姓名" /></div>
  <div class="row"><a href="#help">帮助链接</a></div>
  <p id="status">尚未提交</p>
  <script>
    document.getElementById('submit').addEventListener('click', function () {
      document.getElementById('status').textContent = '订单已提交';
    });
  </script>
</body>
</html>
