  <text class="mono" x="88" y="112" fill="#0284C7" font-size="14" letter-spacing="3.4">MINICODE · WINDOWS · v0.1.3</text>
  <text class="sans" x="86" y="196" fill="#0B1220" font-size="58" font-weight="800" letter-spacing="-1.6">Give it a target.</text>
  <text class="sans" x="86" y="262" fill="#0B1220" font-size="58" font-weight="800" letter-spacing="-1.6">It finds the pixel.</text>
  <text class="sans" x="90" y="316" fill="#475569" font-size="22">给一句目标描述，它自己找元素、点击、校验回读。纯 Python，core 零依赖。</text>

